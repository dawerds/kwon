<!DOCTYPE html> <html lang="ko"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>지구를 지켜요 🌎</title> <style> /* 전체 페이지 */ body { margin: 0; font-family: Arial, sans-serif; background-color: #f1f8e9; color: #333; } /* 상단 */ header { background-color: #388e3c; color: white; text-align: center; padding: 40px 20px; } header h1 { font-size: 40px; margin-bottom: 10px; } /* 메뉴 */ nav { background-color: #2e7d32; text-align: center; padding: 15px; } nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; } /* 내용 */ section { max-width: 800px; margin: 30px auto; padding: 30px; background-color: white; border-radius: 15px; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1); } h2 { color: #2e7d32; } /* 실천 목록 */ .practice { margin: 15px 0; padding: 15px; background-color: #f1f8e9; border-radius: 10px; } .practice input { margin-right: 10px; } /* 버튼 */ button { background-color: #43a047; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; } button:hover { background-color: #2e7d32; } /* 퀴즈 */ #quizResult { font-weight: bold; margin-top: 15px; } /* 하단 */ footer { background-color: #2e7d32; color: white; text-align: center; padding: 20px; margin-top: 40px; } </style> </head> <body> <!-- 제목 --> <header> <h1>🌎 지구를 지켜요</h1> <p>작은 실천이 지구를 바꿉니다.</p> </header> <!-- 메뉴 --> <nav> <a href="#problem">환경 문제</a> <a href="#practice">실천 방법</a> <a href="#quiz">환경 퀴즈</a> </nav> <!-- 환경 문제 --> <section id="problem"> <h2>🌱 우리가 환경을 보호해야 하는 이유</h2> <p> 지구는 기후 변화, 플라스틱 쓰레기, 대기 오염 등 다양한 환경 문제를 겪고 있습니다. </p> <p> 이러한 문제를 해결하기 위해서는 정부와 기업뿐만 아니라 우리들의 작은 실천도 중요합니다. </p> </section> <!-- 실천 방법 --> <section id="practice"> <h2>♻️ 오늘의 환경 보호 실천</h2> <p> 오늘 실천한 활동을 체크해 보세요! </p> <div class="practice"> <label> <input type="checkbox" id="recycle"> ♻️ 쓰레기를 분리배출했다. </label> </div> <div class="practice"> <label> <input type="checkbox" id="tumbler"> 🥤 일회용품 대신 텀블러를 사용했다. </label> </div> <div class="practice"> <label> <input type="checkbox" id="transport"> 🚌 대중교통을 이용했다. </label> </div> <div class="practice"> <label> <input type="checkbox" id="electricity"> 💡 사용하지 않는 전등을 껐다. </label> </div> <br> <button onclick="checkPractice()"> 실천 결과 확인 </button> <p id="result"></p> </section> <!-- 퀴즈 --> <section id="quiz"> <h2>🧠 환경 퀴즈</h2> <p> 다음 중 환경 보호에 도움이 되는 행동은 무엇일까요? </p> <button onclick="quiz(1)"> ① 일회용품을 계속 사용한다 </button> <br><br> <button onclick="quiz(2)"> ② 사용하지 않는 전등을 끈다 </button> <br><br> <button onclick="quiz(3)"> ③ 쓰레기를 아무 곳에나 버린다 </button> <p id="quizResult"></p> </section> <!-- 하단 --> <footer> 🌱 함께 실천하는 깨끗한 지구 </footer> <script> // 환경 보호 실천 개수 확인 function checkPractice() { let count = 0; if (document.getElementById("recycle").checked) { count++; } if (document.getElementById("tumbler").checked) { count++; } if (document.getElementById("transport").checked) { count++; } if (document.getElementById("electricity").checked) { count++; } let result = document.getElementById("result"); result.innerText = "오늘 총 " + count + "개의 환경 보호 활동을 실천했습니다! 🌱"; } // 환경 퀴즈 function quiz(answer) { let result = document.getElementById("quizResult"); if (answer === 2) { result.innerText = "정답입니다! 🎉 전기를 절약하는 것은 환경 보호에 도움이 됩니다."; } else { result.innerText = "아쉽습니다! 다시 생각해 보세요. 🤔"; } } </script> </body> </html>
